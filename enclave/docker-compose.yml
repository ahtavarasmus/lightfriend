services:
  lightfriend:
    image: ahtavarasmus/lightfriend-enclave:latest
    build:
      context: ..
      dockerfile: enclave/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    container_name: lightfriend-enclave
    environment:
      # Core application
      PG_DATABASE_URL: postgres://lightfriend:lightfriend@localhost:5432/lightfriend_db?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MEDIA_STREAM_USD_PER_MIN: ${TWILIO_MEDIA_STREAM_USD_PER_MIN:-0.0044}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_CREDITS_PRODUCT_ID: ${STRIPE_CREDITS_PRODUCT_ID:-}
      STRIPE_ASSISTANT_PLAN_PRICE_ID: ${STRIPE_ASSISTANT_PLAN_PRICE_ID:-}
      STRIPE_ASSISTANT_PLAN_PRICE_ID_US: ${STRIPE_ASSISTANT_PLAN_PRICE_ID_US:-}
      STRIPE_AUTOPILOT_PLAN_PRICE_ID: ${STRIPE_AUTOPILOT_PLAN_PRICE_ID:-}
      STRIPE_AUTOPILOT_PLAN_PRICE_ID_US: ${STRIPE_AUTOPILOT_PLAN_PRICE_ID_US:-}
      STRIPE_ASSISTANT_CHECKOUT_PRICE_ID: ${STRIPE_ASSISTANT_CHECKOUT_PRICE_ID:-}
      STRIPE_ASSISTANT_CHECKOUT_PRICE_ID_US: ${STRIPE_ASSISTANT_CHECKOUT_PRICE_ID_US:-}
      STRIPE_AUTOPILOT_CHECKOUT_PRICE_ID: ${STRIPE_AUTOPILOT_CHECKOUT_PRICE_ID:-}
      STRIPE_AUTOPILOT_CHECKOUT_PRICE_ID_US: ${STRIPE_AUTOPILOT_CHECKOUT_PRICE_ID_US:-}
      STRIPE_BYOT_CHECKOUT_PRICE_ID: ${STRIPE_BYOT_CHECKOUT_PRICE_ID:-}
      STRIPE_ASSISTANT_PRODUCT_ID: ${STRIPE_ASSISTANT_PRODUCT_ID:-}
      STRIPE_AUTOPILOT_PRODUCT_ID: ${STRIPE_AUTOPILOT_PRODUCT_ID:-}
      STRIPE_BYOT_PRODUCT_ID: ${STRIPE_BYOT_PRODUCT_ID:-}
      # Metronome usage billing (keep disabled until sandbox and production setup pass)
      METRONOME_BILLING_ENABLED: ${METRONOME_BILLING_ENABLED:-false}
      METRONOME_API_KEY: ${METRONOME_API_KEY:-}
      METRONOME_API_URL: ${METRONOME_API_URL:-https://api.metronome.com}
      METRONOME_PACKAGE_ALIAS: ${METRONOME_PACKAGE_ALIAS:-lightfriend-monthly}
      METRONOME_USAGE_EVENT_TYPE: ${METRONOME_USAGE_EVENT_TYPE:-lightfriend_usage}
      METRONOME_BILLABLE_METRIC_ID: ${METRONOME_BILLABLE_METRIC_ID:-}
      METRONOME_USAGE_PRODUCT_ID: ${METRONOME_USAGE_PRODUCT_ID:-}
      METRONOME_WEBHOOK_SECRET: ${METRONOME_WEBHOOK_SECRET:-}
      METRONOME_LEGACY_CREDIT_PRODUCT_ID: ${METRONOME_LEGACY_CREDIT_PRODUCT_ID:-}
      METRONOME_CREDIT_TYPE_ID: ${METRONOME_CREDIT_TYPE_ID:-}
      # Matrix
      MATRIX_HOMESERVER: http://localhost:8008
      MATRIX_SHARED_SECRET: ${MATRIX_HOMESERVER_SHARED_SECRET}
      MATRIX_REGISTRATION_TOKEN: ${MATRIX_REGISTRATION_TOKEN}
      MATRIX_HOMESERVER_PERSISTENT_STORE_PATH: /app/matrix_store
      MATRIX_HOMESERVER_SHARED_SECRET: ${MATRIX_HOMESERVER_SHARED_SECRET}
      DOUBLE_PUPPET_SECRET: ${DOUBLE_PUPPET_SECRET}
      WHATSAPP_BRIDGE_BOT: "@whatsappbot:localhost"
      SIGNAL_BRIDGE_BOT: "@signalbot:localhost"
      TELEGRAM_BRIDGE_BOT: "@telegrambot:localhost"
      # Tuwunel is transport state only. Keep credentials/current state, not content history.
      TUWUNEL_ADMIN_USER_ID: ${TUWUNEL_ADMIN_USER_ID:-1}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_ENABLED: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_ENABLED:-false}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_INITIAL_DELAY_SECS: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_INITIAL_DELAY_SECS:-20}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_REFRESH_SECS: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_REFRESH_SECS:-300}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_RESPONSE_TIMEOUT_SECS: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_RESPONSE_TIMEOUT_SECS:-60}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_MAX_HISTORY_PAGES: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_MAX_HISTORY_PAGES:-50}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_SNAPSHOT_FILE: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_SNAPSHOT_FILE:-/tmp/tuwunel-rocksdb-database-files.md}
      TUWUNEL_ROCKSDB_DIAGNOSTICS_STATUS_FILE: ${TUWUNEL_ROCKSDB_DIAGNOSTICS_STATUS_FILE:-/tmp/tuwunel-rocksdb-diagnostics-status.txt}
      TUWUNEL_EVENT_PURGE_ENABLED: ${TUWUNEL_EVENT_PURGE_ENABLED:-true}
      TUWUNEL_EVENT_PURGE_DRY_RUN: ${TUWUNEL_EVENT_PURGE_DRY_RUN:-false}
      TUWUNEL_EVENT_PURGE_RETENTION_SECS: ${TUWUNEL_EVENT_PURGE_RETENTION_SECS:-60}
      TUWUNEL_EVENT_PURGE_POLL_SECS: ${TUWUNEL_EVENT_PURGE_POLL_SECS:-30}
      TUWUNEL_EVENT_PURGE_MAX_ATTEMPTS: ${TUWUNEL_EVENT_PURGE_MAX_ATTEMPTS:-5}
      TUWUNEL_EVENT_PURGE_BATCH_SIZE: ${TUWUNEL_EVENT_PURGE_BATCH_SIZE:-50}
      TUWUNEL_EVENT_PURGE_BACKFILL_ENABLED: ${TUWUNEL_EVENT_PURGE_BACKFILL_ENABLED:-true}
      TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_ENABLED: ${TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_ENABLED:-true}
      TUWUNEL_EVENT_PURGE_BACKFILL_EXECUTE_VERIFIED_ENABLED: ${TUWUNEL_EVENT_PURGE_BACKFILL_EXECUTE_VERIFIED_ENABLED:-true}
      TUWUNEL_EVENT_PURGE_BACKFILL_EXECUTE_BLOCKED_ENABLED: ${TUWUNEL_EVENT_PURGE_BACKFILL_EXECUTE_BLOCKED_ENABLED:-true}
      TUWUNEL_EVENT_PURGE_BACKFILL_BATCH_SIZE: ${TUWUNEL_EVENT_PURGE_BACKFILL_BATCH_SIZE:-50}
      TUWUNEL_EVENT_PURGE_BACKFILL_SCAN_SECS: ${TUWUNEL_EVENT_PURGE_BACKFILL_SCAN_SECS:-60}
      TUWUNEL_EVENT_PURGE_BACKFILL_MIN_AGE_SECS: ${TUWUNEL_EVENT_PURGE_BACKFILL_MIN_AGE_SECS:-60}
      TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_RECHECK_SECS: ${TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_RECHECK_SECS:-300}
      TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_MAX_PAGES: ${TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_MAX_PAGES:-100}
      TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_PAGE_SIZE: ${TUWUNEL_EVENT_PURGE_BACKFILL_AUDIT_PAGE_SIZE:-100}
      TUWUNEL_EVENT_PURGE_STALE_INGEST_SECS: ${TUWUNEL_EVENT_PURGE_STALE_INGEST_SECS:-300}
      TUWUNEL_EVENT_PURGE_EXHAUSTED_RETRY_SECS: ${TUWUNEL_EVENT_PURGE_EXHAUSTED_RETRY_SECS:-900}
      TUWUNEL_PORTAL_CENSUS_PURGE_ENABLED: ${TUWUNEL_PORTAL_CENSUS_PURGE_ENABLED:-true}
      TUWUNEL_PORTAL_CENSUS_SCAN_SECS: ${TUWUNEL_PORTAL_CENSUS_SCAN_SECS:-300}
      TUWUNEL_PORTAL_CENSUS_TARGET_BATCH_SIZE: ${TUWUNEL_PORTAL_CENSUS_TARGET_BATCH_SIZE:-5}
      TUWUNEL_PORTAL_CENSUS_ROOM_BATCH_SIZE: ${TUWUNEL_PORTAL_CENSUS_ROOM_BATCH_SIZE:-100}
      TUWUNEL_PORTAL_CENSUS_PURGE_BATCH_SIZE: ${TUWUNEL_PORTAL_CENSUS_PURGE_BATCH_SIZE:-20}
      TUWUNEL_SERVER_CENSUS_PURGE_ENABLED: ${TUWUNEL_SERVER_CENSUS_PURGE_ENABLED:-true}
      TUWUNEL_SERVER_CENSUS_SCAN_SECS: ${TUWUNEL_SERVER_CENSUS_SCAN_SECS:-21600}
      TUWUNEL_SERVER_CENSUS_PAGE_SIZE: ${TUWUNEL_SERVER_CENSUS_PAGE_SIZE:-5000}
      TUWUNEL_SERVER_CENSUS_MAX_PAGES: ${TUWUNEL_SERVER_CENSUS_MAX_PAGES:-10}
      TUWUNEL_SERVER_CENSUS_HTTP_TIMEOUT_SECS: ${TUWUNEL_SERVER_CENSUS_HTTP_TIMEOUT_SECS:-120}
      TUWUNEL_PURGE_STATUS_POLL_BATCH_SIZE: ${TUWUNEL_PURGE_STATUS_POLL_BATCH_SIZE:-100}
      TUWUNEL_PURGE_MAX_IN_FLIGHT: ${TUWUNEL_PURGE_MAX_IN_FLIGHT:-4}
      # Offline RocksDB history rewriting stays opt-in until it is proven
      # compatible with the pinned Tuwunel database implementation.
      TUWUNEL_HISTORICAL_STATE_PRUNE_ENABLED: ${TUWUNEL_HISTORICAL_STATE_PRUNE_ENABLED:-false}
      TUWUNEL_HISTORICAL_STATE_PRUNE_RETENTION_SECS: ${TUWUNEL_HISTORICAL_STATE_PRUNE_RETENTION_SECS:-60}
      TUWUNEL_HISTORICAL_STATE_COMPACTION_ENABLED: ${TUWUNEL_HISTORICAL_STATE_COMPACTION_ENABLED:-true}
      TUWUNEL_HISTORICAL_STATE_COMPACTION_SAFETY_BYTES: ${TUWUNEL_HISTORICAL_STATE_COMPACTION_SAFETY_BYTES:-134217728}
      TUWUNEL_COMPACTION_AFTER_BACKUP_ENABLED: ${TUWUNEL_COMPACTION_AFTER_BACKUP_ENABLED:-true}
      TUWUNEL_COMPACTION_COOLDOWN_SECS: ${TUWUNEL_COMPACTION_COOLDOWN_SECS:-86400}
      TUWUNEL_COMPACTION_SAFETY_BYTES: ${TUWUNEL_COMPACTION_SAFETY_BYTES:-134217728}
      TUWUNEL_COMPACTION_MAX_BACKUP_AGE_SECS: ${TUWUNEL_COMPACTION_MAX_BACKUP_AGE_SECS:-600}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_AUDIT_ENABLED: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_AUDIT_ENABLED:-true}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_ENABLED: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_ENABLED:-true}
      TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_PURGE_ENABLED: ${TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_PURGE_ENABLED:-true}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_GRACE_SECS: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_GRACE_SECS:-120}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_POLL_SECS: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_POLL_SECS:-30}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_MAX_ATTEMPTS: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_MAX_ATTEMPTS:-5}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_RETRY_SECS: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_RETRY_SECS:-300}
      TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_SCAN_SECS: ${TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_SCAN_SECS:-300}
      TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_PROOF_RECHECK_SECS: ${TUWUNEL_DISCONNECTED_BRIDGE_ORPHAN_PROOF_RECHECK_SECS:-300}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_BATCH_SIZE: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_BATCH_SIZE:-10}
      TUWUNEL_DISCONNECTED_BRIDGE_PURGE_ROOM_LIMIT: ${TUWUNEL_DISCONNECTED_BRIDGE_PURGE_ROOM_LIMIT:-5}
      TUWUNEL_MEDIA_MAX_BYTES: ${TUWUNEL_MEDIA_MAX_BYTES:-1048576}
      TUWUNEL_MEDIA_RETENTION_SECS: ${TUWUNEL_MEDIA_RETENTION_SECS:-60}
      TUWUNEL_ARCHIVE_LOG_MAX_BYTES: ${TUWUNEL_ARCHIVE_LOG_MAX_BYTES:-8388608}
      TUWUNEL_ARCHIVE_LOG_RETENTION_SECS: ${TUWUNEL_ARCHIVE_LOG_RETENTION_SECS:-3600}
      TUWUNEL_ARCHIVE_LOG_MIN_AGE_SECS: ${TUWUNEL_ARCHIVE_LOG_MIN_AGE_SECS:-600}
      # AI APIs
      ELEVENLABS_SERVER_URL_SECRET: ${ELEVENLABS_SERVER_URL_SECRET:-}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET:-}
      # Phone numbers
      FIN_PHONE: ${FIN_PHONE:-}
      USA_PHONE: ${USA_PHONE:-}
      AUS_PHONE: ${AUS_PHONE:-}
      GB_PHONE: ${GB_PHONE:-}
      NL_PHONE: ${NL_PHONE:-}
      CAN_PHONE: ${CAN_PHONE:-}
      # ElevenLabs phone number IDs
      USA_PHONE_NUMBER_ID: ${USA_PHONE_NUMBER_ID:-}
      FIN_PHONE_NUMBER_ID: ${FIN_PHONE_NUMBER_ID:-}
      AUS_PHONE_NUMBER_ID: ${AUS_PHONE_NUMBER_ID:-}
      GB_PHONE_NUMBER_ID: ${GB_PHONE_NUMBER_ID:-}
      NL_PHONE_NUMBER_ID: ${NL_PHONE_NUMBER_ID:-}
      CAN_PHONE_NUMBER_ID: ${CAN_PHONE_NUMBER_ID:-}
      # AI APIs
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_REALTIME_REASONING_EFFORT: ${OPENAI_REALTIME_REASONING_EFFORT:-low}
      OPENAI_REALTIME_TEXT_INPUT_USD_PER_MILLION: ${OPENAI_REALTIME_TEXT_INPUT_USD_PER_MILLION:-}
      OPENAI_REALTIME_AUDIO_INPUT_USD_PER_MILLION: ${OPENAI_REALTIME_AUDIO_INPUT_USD_PER_MILLION:-}
      OPENAI_REALTIME_CACHED_INPUT_USD_PER_MILLION: ${OPENAI_REALTIME_CACHED_INPUT_USD_PER_MILLION:-}
      OPENAI_REALTIME_TEXT_OUTPUT_USD_PER_MILLION: ${OPENAI_REALTIME_TEXT_OUTPUT_USD_PER_MILLION:-}
      OPENAI_REALTIME_AUDIO_OUTPUT_USD_PER_MILLION: ${OPENAI_REALTIME_AUDIO_OUTPUT_USD_PER_MILLION:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-notifications@lightfriend.ai}
      # Admin
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-12345678}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-+12345678}
      # Runtime
      FRONTEND_URL: ${FRONTEND_URL:-}
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_URL: ${SERVER_URL:-}
      ASSISTANT_ID: ${ASSISTANT_ID:-}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:-}
      LIGHT_TOOL_PUSH_ALLOWED_HOSTS: ${LIGHT_TOOL_PUSH_ALLOWED_HOSTS:-production.lightphonecloud.com}
      # Enclave mode
      SKIP_BACKEND: ${SKIP_BACKEND:-false}
      # Local-only fallback. Production should derive the backup key inside the enclave.
      ALLOW_INSECURE_BACKUP_KEY_FALLBACK: ${ALLOW_INSECURE_BACKUP_KEY_FALLBACK:-false}
      INSECURE_BACKUP_ENCRYPTION_KEY_FALLBACK: ${INSECURE_BACKUP_ENCRYPTION_KEY_FALLBACK:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      MARLIN_ROOT_SERVER_ENDPOINT: ${MARLIN_ROOT_SERVER_ENDPOINT:-}
      MARLIN_ROOT_SERVER_X25519_PUBKEY: ${MARLIN_ROOT_SERVER_X25519_PUBKEY:-}
      MARLIN_KMS_CONTRACT_ADDRESS: ${MARLIN_KMS_CONTRACT_ADDRESS:-}
      MARLIN_BACKUP_KEY_PATH: ${MARLIN_BACKUP_KEY_PATH:-lightfriend.backup.v1}
      MARLIN_BACKUP_KEY_COMMAND: ${MARLIN_BACKUP_KEY_COMMAND:-}
      # Cloudflare tunnel (Nitro Enclave mode)
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # Telegram bridge
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-}
      TELEGRAM_PROXY_ADDRESS: ${TELEGRAM_PROXY_ADDRESS:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-}
      TELEGRAM_PROXY_USERNAME: ${TELEGRAM_PROXY_USERNAME:-}
      TELEGRAM_PROXY_PASSWORD: ${TELEGRAM_PROXY_PASSWORD:-}
      TELEGRAM_PUBLIC_EXTERNAL_URL: ${TELEGRAM_PUBLIC_EXTERNAL_URL:-}
      # VSOCK proxy (Nitro Enclave)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - tuwunel_data:/var/lib/tuwunel
      - bridge_data:/data/bridges
      - core_data:/app/data
      - core_uploads:/app/uploads
      - core_matrix_store:/app/matrix_store
      - ./seed:/data/seed
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8008:8008"
      - "127.0.0.1:29317:29317"

volumes:
  pg_data:
  tuwunel_data:
  bridge_data:
  core_data:
  core_uploads:
  core_matrix_store:
